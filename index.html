<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog Produk</title>
<style>
  :root {
    --accent:   #2a5298;
    --accent2:  #e74c3c;
    --success:  #27ae60;
    --bg:       #f0f4f8;
    --card:     #ffffff;
    --border:   #dde3ea;
    --text:     #1a2535;
    --muted:    #6b7a8d;
    --radius:   10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .site-header {
    background: var(--accent);
    color: #fff;
    padding: 0 20px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; gap: 16px;
    height: 60px; flex-wrap: wrap;
  }
  .store-name { font-size: 1.2rem; font-weight: 700; white-space: nowrap; }
  .header-wa {
    margin-left: auto;
    background: #25d366; color: #fff;
    padding: 7px 14px; border-radius: 20px;
    text-decoration: none; font-size: 0.85rem; font-weight: 600;
    white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .header-wa:hover { background: #1ebe5d; }

  /* ── SEARCH + FILTER BAR ── */
  .toolbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    position: sticky; top: 60px; z-index: 99;
  }
  .toolbar-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .search-box {
    flex: 1; min-width: 180px;
    padding: 9px 14px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 0.95rem; outline: none;
  }
  .search-box:focus { border-color: var(--accent); }

  .filter-scroll {
    display: flex; gap: 8px; overflow-x: auto;
    scrollbar-width: none; flex: 2;
  }
  .filter-scroll::-webkit-scrollbar { display: none; }

  .pill {
    padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted);
    cursor: pointer; font-size: 0.85rem; white-space: nowrap;
    transition: all .15s;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .stok-toggle {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.85rem; color: var(--muted); white-space: nowrap; cursor: pointer;
  }
  .stok-toggle input { accent-color: var(--accent); }

  /* ── GRID PRODUK ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  .stat-bar {
    font-size: 0.85rem; color: var(--muted);
    margin-bottom: 16px;
  }
  .stat-bar span { color: var(--accent); font-weight: 600; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  /* ── CARD ── */
  .card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    transition: box-shadow .2s, transform .2s;
    cursor: pointer;
    display: flex; flex-direction: column;
  }
  .card:hover { box-shadow: 0 4px 16px rgba(42,82,152,.15); transform: translateY(-2px); }
  .card.habis { opacity: .6; }

  .card-img {
    width: 100%; aspect-ratio: 1/1;
    object-fit: cover; background: #f0f4f8;
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; color: #c8d0d8;
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }

  .card-body { padding: 10px 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .card-kategori { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .card-nama { font-size: 0.95rem; font-weight: 600; line-height: 1.3; }
  .card-harga { font-size: 1rem; font-weight: 700; color: var(--accent); margin-top: auto; padding-top: 6px; }
  .card-harga-range { font-size: 0.85rem; }
  .card-satuan { font-size: 0.75rem; color: var(--muted); }

  .badge-stok {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    font-size: 0.72rem; font-weight: 600; margin-top: 4px;
  }
  .badge-stok.ada { background: #e8f8ef; color: var(--success); }
  .badge-stok.habis { background: #fdecea; color: var(--accent2); }
  .badge-varian { background: #e8edf8; color: var(--accent); }

  /* ── MODAL ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.5); z-index: 200;
    align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }

  .modal {
    background: var(--card); border-radius: 14px;
    max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,.25);
  }
  .modal-img {
    width: 100%; aspect-ratio: 4/3; object-fit: cover;
    background: #f0f4f8; font-size: 5rem; color: #c8d0d8;
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px 14px 0 0; overflow: hidden;
  }
  .modal-img img { width: 100%; height: 100%; object-fit: cover; }
  .modal-body { padding: 20px; }
  .modal-kategori { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .modal-nama { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
  .modal-deskripsi { font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
  .modal-harga { font-size: 1.4rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .modal-stok { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }

  .varian-list { margin-bottom: 16px; }
  .varian-list h4 { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
  .varian-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .varian-chip {
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 20px;
    font-size: 0.82rem; cursor: pointer; transition: all .15s;
  }
  .varian-chip:hover, .varian-chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  .varian-chip.habis { opacity: .5; cursor: default; }

  .btn-wa {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 13px; border-radius: 10px;
    background: #25d366; color: #fff;
    text-decoration: none; font-weight: 700; font-size: 1rem;
    transition: background .15s;
  }
  .btn-wa:hover { background: #1ebe5d; }
  .btn-wa.disabled { background: var(--muted); pointer-events: none; }

  .modal-close {
    position: sticky; top: 0; float: right;
    margin: 10px 10px 0 0;
    background: rgba(0,0,0,.08); border: none; border-radius: 50%;
    width: 32px; height: 32px; font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }
  .modal-close:hover { background: rgba(0,0,0,.18); }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 3rem; margin-bottom: 12px; }

  /* ── UPDATE INFO ── */
  .update-bar {
    text-align: center; font-size: 0.75rem; color: var(--muted);
    padding: 8px; border-top: 1px solid var(--border);
    background: var(--card); margin-top: 32px;
  }

  /* ── LOADING ── */
  .loading { text-align: center; padding: 60px; color: var(--muted); }
  .spinner {
    width: 36px; height: 36px; border: 4px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .container { padding: 12px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <div class="store-name" id="storeName">🏪 Katalog Produk</div>
    <a class="header-wa" id="headerWa" href="#" target="_blank">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
        <path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.556 4.118 1.528 5.843L.057 23.882l6.197-1.624A11.953 11.953 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.882a9.875 9.875 0 01-5.031-1.377l-.361-.214-3.741.981 1-3.633-.235-.374A9.862 9.862 0 012.118 12C2.118 6.537 6.537 2.118 12 2.118c5.462 0 9.882 4.419 9.882 9.882 0 5.462-4.42 9.882-9.882 9.882z"/>
      </svg>
      Hubungi Kami
    </a>
  </div>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="toolbar-inner">
    <input class="search-box" type="search" id="searchInput"
           placeholder="🔍 Cari produk..." oninput="filterProduk()">
    <div class="filter-scroll" id="filterKategori"></div>
    <label class="stok-toggle">
      <input type="checkbox" id="onlyTersedia" onchange="filterProduk()">
      Tersedia saja
    </label>
  </div>
</div>

<!-- MAIN -->
<div class="container">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Memuat katalog...</div>
  </div>
  <div id="statBar" class="stat-bar" style="display:none"></div>
  <div class="grid" id="produkGrid"></div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="empty-icon">🔍</div>
    <div>Produk tidak ditemukan</div>
  </div>
  <div class="update-bar" id="updateBar"></div>
</div>

<!-- MODAL DETAIL -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-img" id="modalImg"></div>
    <div class="modal-body">
      <div class="modal-kategori" id="modalKategori"></div>
      <div class="modal-nama" id="modalNama"></div>
      <div class="modal-deskripsi" id="modalDeskripsi"></div>
      <div class="modal-harga" id="modalHarga"></div>
      <div class="modal-stok" id="modalStok"></div>
      <div class="varian-list" id="varianList" style="display:none">
        <h4>Pilih Varian:</h4>
        <div class="varian-grid" id="varianGrid"></div>
      </div>
      <a class="btn-wa" id="modalWa" href="#" target="_blank">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
          <path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.556 4.118 1.528 5.843L.057 23.882l6.197-1.624A11.953 11.953 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.882a9.875 9.875 0 01-5.031-1.377l-.361-.214-3.741.981 1-3.633-.235-.374A9.862 9.862 0 012.118 12C2.118 6.537 6.537 2.118 12 2.118c5.462 0 9.882 4.419 9.882 9.882 0 5.462-4.42 9.882-9.882 9.882z"/>
        </svg>
        Tanya via WhatsApp
      </a>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────────
let allProduk = [];
let storeInfo = {};
let activeKategori = 'Semua';
let selectedVarian = null;
let currentProduk = null;

// ── LOAD DATA ──────────────────────────────────────────────────────────────────
async function loadKatalog() {
  try {
    const resp = await fetch(`katalog.json?v=${Date.now()}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    allProduk = data.produk || [];
    storeInfo = data.toko || {};

    // Update store name & WA button
    document.getElementById('storeName').textContent = '🏪 ' + (storeInfo.nama_toko || 'Toko Kami');
    document.title = storeInfo.nama_toko || 'Katalog Produk';

    const wa = (storeInfo.whatsapp_toko || storeInfo.telepon_toko || '').replace(/\D/g, '');
    if (wa) {
      document.getElementById('headerWa').href = `https://wa.me/${wa}`;
    }

    // Build kategori pills
    const kategoriList = ['Semua', ...(data.kategori || [])];
    const filterEl = document.getElementById('filterKategori');
    filterEl.innerHTML = kategoriList.map(k =>
      `<button class="pill ${k === 'Semua' ? 'active' : ''}"
               onclick="setKategori('${escHtml(k)}')" id="pill-${escHtml(k)}">${escHtml(k)}</button>`
    ).join('');

    // Update info bar
    const meta = data.meta || {};
    document.getElementById('updateBar').textContent =
      `Terakhir diperbarui: ${formatDate(meta.generated_at)} · ${meta.total_produk} produk`;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('statBar').style.display = '';
    filterProduk();

    // Auto-refresh setiap 5 menit
    setTimeout(loadKatalog, 5 * 60 * 1000);

  } catch (err) {
    document.getElementById('loading').innerHTML =
      `<div class="empty-icon">⚠️</div><div>Gagal memuat katalog.<br><small>${err.message}</small></div>`;
  }
}

// ── FILTER ─────────────────────────────────────────────────────────────────────
function filterProduk() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const onlyTersedia = document.getElementById('onlyTersedia').checked;

  const filtered = allProduk.filter(p => {
    const matchKat = activeKategori === 'Semua' || p.kategori === activeKategori;
    const matchQ = !q ||
      p.nama.toLowerCase().includes(q) ||
      (p.deskripsi || '').toLowerCase().includes(q) ||
      (p.kode || '').toLowerCase().includes(q);
    const matchStok = !onlyTersedia || p.tersedia;
    return matchKat && matchQ && matchStok;
  });

  renderGrid(filtered);

  const total = allProduk.filter(p =>
    (activeKategori === 'Semua' || p.kategori === activeKategori)
  ).length;
  document.getElementById('statBar').innerHTML =
    `Menampilkan <span>${filtered.length}</span> dari <span>${total}</span> produk` +
    (activeKategori !== 'Semua' ? ` di kategori <span>${escHtml(activeKategori)}</span>` : '');
}

function setKategori(kat) {
  activeKategori = kat;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  const el = document.getElementById(`pill-${kat}`);
  if (el) el.classList.add('active');
  filterProduk();
}

// ── RENDER GRID ────────────────────────────────────────────────────────────────
function renderGrid(produkList) {
  const grid = document.getElementById('produkGrid');
  const empty = document.getElementById('emptyState');

  if (!produkList.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = produkList.map(p => {
    const hargaStr = p.has_varian && p.harga_max && p.harga_max !== p.harga
      ? `Rp ${fmt(p.harga)} – ${fmt(p.harga_max)}`
      : `Rp ${fmt(p.harga)}`;

    const fotoEl = p.foto
      ? `<div class="card-img"><img src="${escHtml(p.foto)}" alt="${escHtml(p.nama)}" loading="lazy"
              onerror="this.parentElement.innerHTML='📦'"></div>`
      : `<div class="card-img">📦</div>`;

    const badgeVarian = p.has_varian
      ? `<span class="badge-stok badge-varian">${p.varian.length} varian</span>` : '';
    const badgeStok = p.tersedia
      ? `<span class="badge-stok ada">● Tersedia</span>`
      : `<span class="badge-stok habis">● Habis</span>`;

    return `
      <div class="card ${p.tersedia ? '' : 'habis'}" onclick="openModal(${p.id})">
        ${fotoEl}
        <div class="card-body">
          <div class="card-kategori">${escHtml(p.kategori)}</div>
          <div class="card-nama">${escHtml(p.nama)}</div>
          <div class="card-harga ${p.has_varian ? 'card-harga-range' : ''}">${hargaStr}</div>
          <div class="card-satuan">${escHtml(p.satuan || '')}</div>
          ${badgeStok}${badgeVarian}
        </div>
      </div>`;
  }).join('');
}

// ── MODAL ──────────────────────────────────────────────────────────────────────
function openModal(produkId) {
  const p = allProduk.find(x => x.id === produkId);
  if (!p) return;
  currentProduk = p;
  selectedVarian = null;

  // Foto
  const imgEl = document.getElementById('modalImg');
  imgEl.innerHTML = p.foto
    ? `<img src="${escHtml(p.foto)}" alt="${escHtml(p.nama)}"
            onerror="this.parentElement.innerHTML='📦'">`
    : '📦';

  document.getElementById('modalKategori').textContent = p.kategori;
  document.getElementById('modalNama').textContent = p.nama;
  document.getElementById('modalDeskripsi').textContent = p.deskripsi || '';

  // Harga
  updateModalHarga(p);

  // Varian
  const varianList = document.getElementById('varianList');
  const varianGrid = document.getElementById('varianGrid');
  if (p.has_varian && p.varian.length > 0) {
    varianList.style.display = '';
    varianGrid.innerHTML = p.varian.map((v, i) =>
      `<div class="varian-chip ${!v.tersedia ? 'habis' : ''}"
            onclick="selectVarian(${i})" id="vchip-${i}">
         ${escHtml(v.label || v.sku_kode)}
       </div>`
    ).join('');
  } else {
    varianList.style.display = 'none';
    varianGrid.innerHTML = '';
  }

  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function selectVarian(idx) {
  if (!currentProduk) return;
  const v = currentProduk.varian[idx];
  if (!v || !v.tersedia) return;

  selectedVarian = v;
  document.querySelectorAll('.varian-chip').forEach(c => c.classList.remove('selected'));
  document.getElementById(`vchip-${idx}`).classList.add('selected');

  document.getElementById('modalHarga').textContent = `Rp ${fmt(v.harga)}`;
  document.getElementById('modalStok').textContent = `Stok: ${v.stok}`;
  updateWaButton();
}

function updateModalHarga(p) {
  if (p.has_varian) {
    const hargaStr = p.harga_max && p.harga_max !== p.harga
      ? `Rp ${fmt(p.harga)} – Rp ${fmt(p.harga_max)}`
      : `Rp ${fmt(p.harga)}`;
    document.getElementById('modalHarga').textContent = hargaStr;
    document.getElementById('modalStok').textContent = `Total stok: ${p.stok} unit`;
  } else {
    document.getElementById('modalHarga').textContent = p.harga ? `Rp ${fmt(p.harga)}` : 'Hubungi kami';
    document.getElementById('modalStok').textContent = p.tersedia
      ? `Stok: ${p.stok} ${p.satuan || ''}` : 'Stok habis';
  }
  updateWaButton();
}

function updateWaButton() {
  const p = currentProduk;
  const wa = (storeInfo.whatsapp_toko || storeInfo.telepon_toko || '').replace(/\D/g, '');
  const btn = document.getElementById('modalWa');

  if (!wa) {
    btn.style.display = 'none';
    return;
  }

  let msg = `Halo, saya ingin menanyakan produk *${p.nama}*`;
  if (selectedVarian) msg += ` (${selectedVarian.label || selectedVarian.sku_kode})`;
  msg += `. Apakah masih tersedia?`;

  const available = p.has_varian ? (selectedVarian ? selectedVarian.tersedia : p.tersedia) : p.tersedia;
  if (available) {
    btn.href = `https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;
    btn.className = 'btn-wa';
    btn.querySelector('svg + *') || (btn.innerHTML += '');
    btn.lastChild.textContent && (btn.textContent = '');
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">

}

function closeModal(event) {
  if (event && event.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow = '';
  currentProduk = null;
  selectedVarian = null;
}

// ── UTILS ──────────────────────────────────────────────────────────────────────
function fmt(n) {
  return (n || 0).toLocaleString('id-ID');
}
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString('id-ID', {
    day:'2-digit', month:'short', year:'numeric',
    hour:'2-digit', minute:'2-digit'
  });
}

// ── KEYBOARD ───────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

loadKatalog();
